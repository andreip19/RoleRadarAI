name: RoleRadar AI - Scheduled Ingestion

on:
  schedule:
    - cron: "15 8 * * *"
      timezone: "Europe/Bucharest"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roleradar-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Collect and Synchronize Jobs

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Validate database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Run job ingestion
        run: python -m scripts.run_ingestion
